[model]
name = "tobramycin"
path = "./models"

[data]
train_file = "./data/tobramycin_train.csv"
test_file = "./data/tobramycin_test.csv"

[data.columns]
id = "ID"
time = "TIME"
dose = "DOSE"
conc = "CP"
evid = "EVID"
covariates = ["AGE", "SEX", "CLCR"]

[settings.train]
epoch = 30
weight_decay = 1e-4
learning_rate = 5e-4
patience = 5
factor = 0.5

[settings.nn]
dim_c = [32, 32, 32]
dim_V = [16]
include_covariates = true
